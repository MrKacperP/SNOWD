name: SNOWDAdmin
options:
  bundleIdPrefix: ca.snowd
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 9LS8P5N78V
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "3"
targets:
  SNOWDAdmin:
    type: application
    platform: iOS
    sources: [SNOWDAdmin]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.snowd.admin
        PRODUCT_NAME: SNOWD Admin
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SNOWD Admin
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock SNOWD Admin with Face ID.
        INFOPLIST_FILE: SNOWDAdmin/Info.plist
        CODE_SIGN_ENTITLEMENTS: SNOWDAdmin/SNOWDAdmin.entitlements
