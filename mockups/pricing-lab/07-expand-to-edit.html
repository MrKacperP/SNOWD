</style></head><body><main id="app" class="app v7"></main><div id="toast" class="toast" role="status" aria-live="polite"></div><dialog id="settings" style="border:1px solid #dce4ed;border-radius:24px;padding:25px;max-width:340px;width:90%;color:#102e3b"><h2>Mockup settings</h2><p style="margin:12px 0 22px;color:#526b78">Prices save only in this browser. This prototype does not change your SNOWD account.</p><button class="secondary full" data-action="reset">Reset example prices</button><button class="primary full" style="margin-top:10px" data-action="close-options">Done</button></dialog><script>
const C={"id": 7, "slug": "expand-to-edit", "name": "Expand to edit", "group": "Focused", "desc": "Scan every price, then expand only the service you need.", "pattern": "Accordion"}, n=C.id;
const services=[{name:'1-car driveway',short:'1 car',desc:'Small driveway',icon:'car',rec:35},{name:'2-car driveway',short:'2 cars',desc:'Medium driveway',icon:'cars',rec:50},{name:'3+ car driveway',short:'3+ cars',desc:'Large driveway',icon:'cars',rec:70},{name:'Porch & sidewalk',short:'Walkway',desc:'Finishing touches',icon:'walk',rec:20}];
const defaults={prices:[40,60,100,20],coverage:[true,false,true,false],enabled:[true,true,true,true]};
let state=structuredClone(defaults), selected=0, step=0, expanded=0, payment='card', dirty=false, saved=false;
try{const s=JSON.parse(localStorage.getItem('snowd-pricing-'+n));if(s&&s.prices?.length===4&&s.prices.every(v=>Number.isFinite(v)&&v>=0&&v<=250)&&s.coverage?.length===4&&s.enabled?.length===4){state=s;saved=true}}catch{}
const icon=(name)=>{const p={snow:'<path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7M8 4l4 3 4-3M8 20l4-3 4 3M3 11l4-2-1-5M21 13l-4 2 1 5M3 13l4 2-1 5M21 11l-4-2 1-5"/>',car:'<path d="m5 9 2-5h10l2 5M4 9h16v8H4zM7 17v3M17 17v3M7 13h1m8 0h1"/>',cars:'<path d="m3 10 2-5h9l2 5M2 10h15v7H2zM5 17v3M14 17v3M5 13h1m7 0h1M18 8h2l2 5v6h-3"/>',walk:'<path d="M3 20h18M5 15h14M7 10h10M9 5h6M12 5v15"/>',arrow:'<path d="m14 6-6 6 6 6"/>',check:'<path d="m5 12 4 4L19 6"/>',spark:'<path d="m12 3 2.7 6.3L21 12l-6.3 2.7L12 21l-2.7-6.3L3 12l6.3-2.7z"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="m9 3-1 3-3 1-2 3 2 3v4l3 2 4-1 3 2 3-2v-4l3-2-1-4-3-1-2-3z"/>',house:'<path d="m3 10 9-7 9 7M5 9v12h14V9M10 21v-7h4v7"/>'};return `<svg viewBox="0 0 24 24" aria-hidden="true">${p[name]||p.snow}</svg>`};
const money=(v)=>'$'+v;
const customer=(i)=>Math.round(state.prices[i]*1.43);
const cost=(i)=>`<div class="costs"><span>Customer cash <b>${money(state.prices[i])}</b></span><span>Card <b>${money(customer(i))}</b></span></div>`;
const title=(i)=>`<div class="svc-title"><span class="service-icon">${icon(services[i].icon)}</span><div><h3>${services[i].name}</h3><p class="muted">${services[i].desc}</p></div></div>`;
const stepper=(i)=>`<div class="stepper"><button data-action="minus" data-i="${i}" aria-label="Decrease ${services[i].name} by 5 dollars" ${state.prices[i]===0?'disabled':''}>−</button><output aria-label="Your earnings for ${services[i].name}">${money(state.prices[i])}</output><button data-action="plus" data-i="${i}" aria-label="Increase ${services[i].name} by 5 dollars" ${state.prices[i]===250?'disabled':''}>+</button></div>`;
const input=(i)=>`<label class="input-money">$<input type="number" inputmode="numeric" min="0" max="250" step="1" data-price="${i}" value="${state.prices[i]}" aria-label="Your earnings for ${services[i].name}"></label>`;
const suggested=(i)=>`<button class="suggest" data-action="suggest" data-i="${i}">${state.prices[i]===services[i].rec?'✓ Suggested rate applied':'Use suggested '+money(services[i].rec)}</button>`;
const advice=()=>`<div class="advice">${icon('spark')}<p>Start with typical<br><b>SNOWD prices.</b></p><button data-action="all">Use all</button></div>`;
const note=()=>`<p class="example-note">Mockup · CAD. Card totals use a sample 1.43× calculation. Suggestions are examples, not local market data.</p>`;
const coverage=()=>`<details class="coverage"><summary>What you clear <span>＋</span></summary><div class="chips">${['Driveway','Front porch','Sidewalk','Backyard patio'].map((v,i)=>`<button class="chip" data-action="coverage" data-i="${i}" aria-pressed="${state.coverage[i]}">${state.coverage[i]?'✓ ':''}${v}</button>`).join('')}</div><p class="caption" style="margin-top:12px">Service preferences; rates are set separately above.</p></details>`;
const tabs=(chosen=selected)=>`<div class="tabs" role="tablist" aria-label="Choose a service">${services.map((s,i)=>`<button role="tab" aria-selected="${chosen===i}" data-action="select" data-i="${i}">${s.short}</button>`).join('')}</div>`;
const progress=()=>`<div class="progress" aria-label="Step ${Math.min(step+1,4)} of 4">${services.map((_,i)=>`<span class="${i<=step?'done':''}"></span>`).join('')}</div>`;
const footer=()=>`<footer class="footer"><p class="save-status" role="status">${dirty?'Unsaved changes':saved?'Saved on this device':'Your earnings, per job'}</p><button class="primary" data-action="save">${icon('check')} ${dirty?'Save changes':'Save my prices'}</button></footer>`;
const card=(i)=>`<article class="card">${title(i)}${stepper(i)}${cost(i)}${suggested(i)}</article>`;
const priceRange=(i)=>`<input class="range" type="range" min="0" max="250" step="5" value="${state.prices[i]}" data-range="${i}" aria-label="Your earnings for ${services[i].name}"><div class="range-labels"><span>$0</span><span>$250</span></div>`;
const headings=['Your work. Your price.','Set your prices.','Your rates, at a glance.','Let’s set your rates.','Your pricing studio.','Make it your own.','A little less clutter.','One service at a time.','Find your sweet spot.','The rate sheet.','Ready for the next storm.','Price your space.','A size for every home.','All your rates. One place.','A smarter starting point.','See what they see.','Let’s work it out.','Pick. Adjust. Done.','What’s your time worth?','Your services. Your say.'];
const subtitles=['Choose what you earn. Keep every rate easy to find.','The amount shown is what you receive for each job.','Your earnings beside what the customer pays.','Four services. A few simple decisions.','Select a service. Give it the right price.','Your earnings, organised your way.','Tap a service to see the details.','A focused space for each of your rates.','Drag a slider or use the suggested amount.','A straightforward menu of your services.','Set your earnings before you head out.','Tap the driveway or the walkway to get started.','Set a clear price for every driveway size.','Type your prices directly. Finish in seconds.','Compare your rates with example SNOWD suggestions.','Your changes update the customer card instantly.','A little guidance to get your prices ready.','Choose any service to open its price editor.','Choose a service, then tune your earnings.','Choose which jobs you take, then set your rates.'];
function screen(){let i=selected;
switch(n){
case 1:return advice()+`<div class="section-label"><h2>Your earnings</h2><span class="caption">Per completed job</span></div><div class="stack">${services.map((s,j)=>card(j)).join('')}</div>`;
case 2:return `<span class="pill">You choose what you earn</span>${services.map((s,j)=>`<section class="big-row" style="${j===0?'margin-top:25px':''}"><h2>${s.name}</h2>${stepper(j)}<p class="muted" style="margin-top:12px">You receive this amount.</p>${suggested(j)}</section>`).join('')}`;
case 3:return `<div class="matrix"><table><thead><tr><th scope="col">Service</th><th scope="col">You earn</th><th scope="col">Cash</th><th scope="col">Card</th></tr></thead><tbody>${services.map((s,j)=>`<tr><td>${s.short}<span class="caption">${j<3?'Driveway':'Porch + sidewalk'}</span></td><td>${input(j)}</td><td>${money(state.prices[j])}</td><td>${money(customer(j))}</td></tr>`).join('')}</tbody></table></div><div style="margin-top:20px">${advice()}</div><div class="card" style="margin-top:20px"><h3>A clearer breakdown</h3><p class="muted" style="margin-top:8px">Your rate is what you take home. Customer totals are shown separately.</p></div>`;
case 4: return step===4?review():`<div class="row"><span class="pill">Step ${step+1} of 4</span><span class="caption">${services[step].desc}</span></div>${progress()}<section class="wizard-card card"><span class="service-icon">${icon(services[step].icon)}</span><h2>${services[step].name}</h2><div class="hero-number"><p>You receive, per job</p></div>${stepper(step)}${suggested(step)}${cost(step)}</section><div class="nav-pair"><button class="secondary" data-action="back" ${step===0?'disabled':''}>Back</button><button class="primary" data-action="next">${step===3?'Review prices':'Next service'} →</button></div>`;
case 5:return `<div class="workspace"><nav class="service-rail" aria-label="Services">${services.map((s,j)=>`<button data-action="select" data-i="${j}" aria-selected="${i===j}">${icon(s.icon)}<span>${s.short}</span></button>`).join('')}</nav><section class="editor"><span class="eyebrow">Editing service ${i+1}</span><h2 style="margin-top:12px">${services[i].name}</h2><div class="hero-number"><div class="money">${money(state.prices[i])}</div><p>Your earnings</p></div>${stepper(i)}${cost(i)}${suggested(i)}</section></div><div class="section-label"><h2>Your whole rate card</h2></div><div class="card stack">${services.map((s,j)=>`<div class="row"><span class="muted">${s.short}</span><b>${money(state.prices[j])}</b></div>`).join('')}</div>`;
case 6:return `<div class="bento">${services.map((s,j)=>`<article class="tile"><span class="service-icon">${icon(s.icon)}</span><h2 style="margin-top:15px">${s.name}</h2><div class="money">${money(state.prices[j])}</div><p class="muted">You earn / job</p>${stepper(j)}</article>`).join('')}</div><div style="margin-top:18px">${advice()}</div>`;
case 7:return `<div class="row" style="margin-bottom:16px"><span class="eyebrow">Service</span><span class="eyebrow">You earn</span></div>${services.map((s,j)=>`<section class="accordion"><button data-action="expand" data-i="${j}" aria-expanded="${expanded===j}"><span><h3>${s.name}</h3><span class="caption">${s.desc}</span></span><span class="row"><span class="amount">${money(state.prices[j])}</span><span class="arrow">${expanded===j?'−':'+'}</span></span></button>${expanded===j?`<div class="expanded">${stepper(j)}${cost(j)}${suggested(j)}</div>`:''}</section>`).join('')}<div style="margin-top:22px">${advice()}</div>`;
case 8:return `<div class="row" style="margin-bottom:22px"><span class="pill">${i+1} / 4 services</span><span class="caption">Your earnings per job</span></div><section class="deck-card"><span class="service-icon">${icon(services[i].icon)}</span><h2>${services[i].name}</h2><p class="muted" style="margin-top:8px">${services[i].desc}</p><div class="money">${money(state.prices[i])}</div><p class="muted">You take home</p>${stepper(i)}${cost(i)}${suggested(i)}</section><div class="nav-pair"><button class="icon-btn" data-action="prev-service" aria-label="Previous service">←</button><div class="dots">${services.map((s,j)=>`<button data-action="select" data-i="${j}" aria-label="Show ${s.name}" aria-current="${i===j}"></button>`).join('')}</div><button class="icon-btn" data-action="next-service" aria-label="Next service">→</button></div>`;
case 9:return advice()+services.map((s,j)=>`<section class="slider-row"><div class="row"><h2>${s.name}</h2><output class="money" data-live="${j}">${money(state.prices[j])}</output></div>${priceRange(j)}${cost(j)}</section>`).join('');
case 10:return `<div class="receipt"><div class="receipt-head"><span class="eyebrow">Snowd · Your services</span><h2 style="margin:12px 0">Winter rate card</h2><p class="caption">YOUR EARNINGS · CAD / JOB</p></div>${services.map((s,j)=>`<div class="receipt-line"><div><h3>${s.name}</h3><p class="caption" style="margin-top:5px">CUSTOMER CARD ${money(customer(j))}</p></div>${input(j)}</div>`).join('')}<div style="text-align:center;padding:24px 0 6px"><span class="check">${icon('check')}</span><p class="caption" style="margin-top:9px">A clear price. A fresh start.</p></div></div><button class="secondary full" style="margin-top:30px" data-action="all">Use all suggested rates</button>`;
case 11:return `<div class="night-summary"><span class="eyebrow">Your driveway rates</span><div class="money">${money(Math.min(...state.prices.slice(0,3)))}–${money(Math.max(...state.prices.slice(0,3)))}</div><p class="muted">What you earn on each completed job.</p></div>${services.map((s,j)=>`<section class="bar-row"><div class="row"><h3>${s.name}</h3><span class="caption">${money(customer(j))} by card</span></div><div class="bar-track"><i style="width:${state.prices[j]/2.5}%"></i></div>${stepper(j)}</section>`).join('')}`;
case 12:return `<div class="property" aria-label="Illustrated property service selector"><div class="tree"></div><div class="house"></div><div class="roof"></div><button class="drive" data-action="select" data-i="${i<3?i:0}" aria-pressed="${i<3}" aria-label="Select driveway">Driveway</button><button class="walk" data-action="select" data-i="3" aria-pressed="${i===3}">Porch & sidewalk</button></div><div class="card">${i<3?`<div class="tabs" role="tablist" aria-label="Driveway size">${services.slice(0,3).map((s,j)=>`<button role="tab" data-action="select" data-i="${j}" aria-selected="${i===j}">${s.short}</button>`).join('')}</div>`:''}${title(i)}${stepper(i)}${cost(i)}${suggested(i)}</div>`;
case 13:return `<div class="row" style="margin-bottom:24px"><span class="eyebrow">Driveway packages</span><span class="caption">You earn</span></div><div class="packages">${services.slice(0,3).map((s,j)=>`<section class="package ${j===1?'featured':''}"><span class="service-icon">${icon(s.icon)}</span><h2>${s.name}</h2><div class="money">${money(state.prices[j])}</div><p class="caption">per job</p>${stepper(j)}</section>`).join('')}</div><div class="section-label"><h2>The finishing touches</h2></div>${card(3)}${advice()}`;
case 14:return `<div class="edit-grid"><div class="grid-head"><span>Service</span><span>Your earnings</span></div>${services.map((s,j)=>`<div class="grid-row"><div><h3>${s.name}</h3><p class="caption" style="margin-top:7px">Card total: ${money(customer(j))}</p></div>${input(j)}</div>`).join('')}</div><section class="bulk"><h3>Adjust every rate</h3><p class="muted" style="margin-top:5px">Make one change across all services.</p><div class="bulk-actions"><button class="secondary" data-action="bulk-down">− $5 each</button><button class="secondary" data-action="bulk-up">+ $5 each</button></div><button class="suggest" data-action="all">Apply all suggested rates →</button></section>`;
case 15:return `<div class="advice" style="margin-bottom:20px">${icon('spark')}<p>Example suggestions.<br><b>You always set the final price.</b></p></div>${services.map((s,j)=>`<section class="recommendation"><div class="row"><h2>${s.name}</h2>${state.prices[j]===s.rec?'<span class="pill">Matched</span>':''}</div><div class="before-after"><div><span class="caption">Your price</span><div class="money">${money(state.prices[j])}</div></div><span style="text-align:center">→</span><div><span class="caption">Suggested</span><div class="money">${money(s.rec)}</div></div></div><button class="primary full" data-action="suggest" data-i="${j}">${state.prices[j]===s.rec?'✓ Applied':'Use '+money(s.rec)}</button>${stepper(j)}</section>`).join('')}`;
case 16:return `${tabs()}<div class="row" style="margin-bottom:12px"><span class="eyebrow">Customer preview</span><span class="pill">Live</span></div><div class="client-preview"><div class="preview-landscape"><span class="service-icon">${icon(services[i].icon)}</span></div><div class="body"><h2>${services[i].name}</h2><p class="muted" style="margin:7px 0 20px">Snow clearing · One visit</p><div class="payment-toggle"><button data-action="cash" aria-pressed="${payment==='cash'}">Cash</button><button data-action="card" aria-pressed="${payment==='card'}">Card</button></div><div class="row"><div class="money">${money(payment==='card'?customer(i):state.prices[i])}</div><span class="muted">Customer total</span></div></div></div><section class="edit-panel"><div class="row"><h3>Your earnings</h3><span class="caption">Set your take-home rate</span></div><div style="margin-top:15px">${stepper(i)}</div>${suggested(i)}</section>`;
case 17:return step===4?review():`<div class="chat"><div><div class="assistant-label"><span class="service-icon">${icon('snow')}</span>SNOWD setup guide</div><div class="bubble"><p>${step===0?'Let’s start small. What would you like to earn for a <b>1-car driveway</b>?':`Next up: <b>${services[step].name}</b>. What would you charge?`}</p><p class="muted" style="font-size:14px;margin-top:12px">An example starting rate is ${money(services[step].rec)}.</p></div></div>${step>0?`<div class="bubble mine">✓ ${services[step-1].name}<br><b>${money(state.prices[step-1])} per job</b></div>`:''}</div><section class="chat-entry"><span class="eyebrow">Your answer</span>${stepper(step)}<button class="primary full" data-action="next">${step===3?'Review my prices':'Set price & continue'} →</button>${suggested(step)}</section><div class="row" style="margin-top:15px"><button class="suggest" data-action="back" ${step===0?'disabled':''}>← Previous question</button><span class="caption">${step+1} of 4</span></div>${progress()}`;
case 18:return `<div class="floating-list" role="tablist" aria-label="Choose service to edit">${services.map((s,j)=>`<button role="tab" data-action="select" data-i="${j}" aria-selected="${i===j}"><span class="svc-title"><span class="service-icon">${icon(s.icon)}</span><h2>${s.name}</h2></span><span class="money">${money(state.prices[j])}</span></button>`).join('')}</div>`;
case 19:return `${tabs()}<div class="dial-label"><h2>${services[i].name}</h2><p class="muted" style="margin-top:6px">Set your take-home amount</p></div><div class="dial" style="--fill:${state.prices[i]/250*360}deg;background:radial-gradient(circle,white 67%,transparent 68%),conic-gradient(var(--pale) var(--fill),transparent 0)"><output class="money" data-live="${i}">${money(state.prices[i])}</output><span class="caption">Your earnings / job</span></div>${stepper(i)}${priceRange(i)}<div class="card" style="margin-top:20px">${cost(i)}${suggested(i)}</div>`;
case 20:return `<div class="advice">${icon('check')}<p><b>${state.enabled.filter(Boolean).length} of 4 services enabled</b><br>Turn off work you don’t take.</p></div>${services.map((s,j)=>`<section class="check-card ${state.enabled[j]?'':'card-off'}"><div class="row"><h2>${s.name}</h2><button class="switch-wrap" role="switch" aria-checked="${state.enabled[j]}" aria-label="Offer ${s.name}" data-action="enable" data-i="${j}"><span class="onoff" aria-hidden="true" aria-checked="${state.enabled[j]}"></span></button></div>${state.enabled[j]?stepper(j)+cost(j):'<p class="muted">Not offered. Turn on to set your rate.</p>'}</section>`).join('')}`;
}}
function review(){return `<div class="advice">${icon('check')}<p><b>Your rate card is ready.</b><br>Review and save your four prices.</p></div><div class="stack" style="margin-top:20px">${services.map((s,j)=>`<div class="card row"><div><h3>${s.name}</h3><button class="suggest" data-action="edit-step" data-i="${j}">Edit price</button></div><span class="money">${money(state.prices[j])}</span></div>`).join('')}</div>`}
function render(){const focus=document.activeElement;const key=focus?.dataset?.action;const idx=focus?.dataset?.i;const opened=document.querySelector('.coverage')?.open;document.getElementById('app').innerHTML=`<header class="top"><a class="brand" href="index.html" aria-label="Back to 20 mockups">${icon('snow')} SNOWD<span style="color:var(--muted)">.</span></a><span class="demo">${String(n).padStart(2,'0')} · Mockup</span><button class="icon-btn" data-action="options" aria-label="Open mockup settings">${icon('gear')}</button></header><section class="intro"><p class="eyebrow">${n===4||n===17?'Price setup':'Shoveler / Pricing'}</p><h1>${headings[n-1]}</h1><p>${subtitles[n-1]}</p></section><div class="content">${screen()}${n===18?'':coverage()+note()}</div>${n===18?`<section class="sheet"><div class="sheet-handle"></div><div class="row"><h2>${services[selected].name}</h2><span class="pill">Editing</span></div>${stepper(selected)}${cost(selected)}${suggested(selected)}<button class="primary" data-action="save">${icon('check')} Save my prices</button><p class="save-status" style="max-width:none;margin-top:10px">${dirty?'Unsaved changes':saved?'Saved on this device':'Your earnings, per job'}</p>${coverage()}${note()}</section>`:footer()}`;if(opened)document.querySelector('.coverage').open=true;if(key){let selector=`[data-action="${key}"]${idx!==undefined?`[data-i="${idx}"]`:''}`;document.querySelector(selector)?.focus({preventScroll:true})}}
function toast(t){const el=document.getElementById('toast');el.textContent=t;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.textContent='',2800)}
function change(i,value){state.prices[i]=Math.min(250,Math.max(0,Math.round(Number(value)||0)));dirty=true}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,i=Number(b.dataset.i);if(['minus','plus','suggest'].includes(a)){change(i,a==='suggest'?services[i].rec:state.prices[i]+(a==='minus'?-5:5))}else if(a==='all'){services.forEach((s,j)=>change(j,s.rec));toast('Suggested prices applied')}else if(a==='bulk-up'||a==='bulk-down'){services.forEach((s,j)=>change(j,state.prices[j]+(a==='bulk-up'?5:-5)))}else if(a==='select')selected=i;else if(a==='expand')expanded=expanded===i?-1:i;else if(a==='next-service')selected=(selected+1)%4;else if(a==='prev-service')selected=(selected+3)%4;else if(a==='next')step=Math.min(4,step+1);else if(a==='back')step=Math.max(0,step-1);else if(a==='edit-step')step=i;else if(a==='cash'||a==='card')payment=a;else if(a==='coverage'){state.coverage[i]=!state.coverage[i];dirty=true}else if(a==='enable'){state.enabled[i]=!state.enabled[i];dirty=true}else if(a==='save'){try{localStorage.setItem('snowd-pricing-'+n,JSON.stringify(state));dirty=false;saved=true;toast('Prices saved on this device')}catch{toast('Storage unavailable. Changes remain in this tab.')}}else if(a==='options'){document.getElementById('settings').showModal();return}else if(a==='close-options'){document.getElementById('settings').close();return}else if(a==='reset'){state=structuredClone(defaults);dirty=true;step=0;selected=0;document.getElementById('settings').close();toast('Original example prices restored')}render();if(['next','back','edit-step'].includes(a)){document.querySelector('.intro').scrollIntoView({behavior:'auto'});document.querySelector('h1').setAttribute('tabindex','-1');document.querySelector('h1').focus({preventScroll:true})}});
document.addEventListener('change',e=>{if(e.target.matches('[data-price]')){change(+e.target.dataset.price,e.target.value);render()}if(e.target.matches('[data-range]')){change(+e.target.dataset.range,e.target.value);render()}});
document.addEventListener('input',e=>{if(e.target.matches('[data-range]')){const i=+e.target.dataset.range;change(i,e.target.value);document.querySelectorAll(`[data-live="${i}"]`).forEach(el=>el.textContent=money(state.prices[i]));const status=document.querySelector('.save-status');if(status)status.textContent='Unsaved changes'}});
if(new URLSearchParams(location.search).has('embed'))document.body.classList.add('embedded');
render();
</script></body></html>
